services:
  postgres:
    image: postgres:16-alpine
    container_name: restaurant-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant_erp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-restaurant_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: restaurant-erp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-fastapi:
    build:
      context: ./services/api-fastapi
      dockerfile: Dockerfile
    container_name: restaurant-erp-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-restaurant_erp}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-development_secret_key_change_in_production}
      - PIN_PEPPER=${PIN_PEPPER:-development_pin_pepper_change_in_production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    # Local dev: apply migrations, then run with autoreload (the image itself runs without --reload).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./services/api-fastapi:/app

  # Subscription renewals: issues renewal invoices, sends reminders, handles past-due and grace. Safe to run several copies.
  billing-worker:
    build:
      context: ./services/api-fastapi
      dockerfile: Dockerfile
    container_name: restaurant-erp-billing-worker
    restart: unless-stopped
    depends_on:
      api-fastapi:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-restaurant_erp}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-development_secret_key_change_in_production}
      - PIN_PEPPER=${PIN_PEPPER:-development_pin_pepper_change_in_production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
    command: python -m app.cli run-billing --loop
    volumes:
      - ./services/api-fastapi:/app

volumes:
  postgres_data:
  redis_data:
