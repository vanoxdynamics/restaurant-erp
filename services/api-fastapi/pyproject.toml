[project]
name = "api-fastapi"
version = "0.1.0"
description = "High-performance asynchronous FastAPI backend for Enterprise Restaurant ERP"
authors = [
    { name = "Restaurant ERP Team" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "pydantic>=2.7.0,<3",
    "email-validator>=2.0.0,<3",
    "pydantic-settings>=2.7.0,<3",
    "sqlalchemy[asyncio]>=2.0.30,<2.2",
    "greenlet>=3.0.0,<4",
    "asyncpg>=0.29.0,<1",
    "redis[hiredis]>=5.0.4,<9",
    "alembic>=1.13.1,<2",
    "pyjwt>=2.9,<3",
    "pwdlib[argon2,bcrypt]>=0.2,<0.4",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "asgi-lifespan>=2.1",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "ASYNC", "DTZ"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
# SQLAlchemy's asyncio layer runs ORM code inside greenlets; trace them too.
concurrency = ["greenlet", "thread"]
source = ["app"]
